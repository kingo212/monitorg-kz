name: Архив площадок

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько минут работать'
        default: '300'

permissions:
  contents: read

jobs:
  archive:
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Almaty
      BUDGET_MIN: ${{ inputs.minutes || '300' }}
      BASE: /monitorg-kz
      SB_URL: ${{ secrets.SB_URL }}
      SB_KEY: ${{ secrets.SB_KEY }}
      SB_TOKEN: ${{ secrets.SB_TOKEN }}
      ALERT_TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
      ALERT_TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Код робота
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kingo212/monitorg-kz-src
          ssh-key: ${{ secrets.SRC_KEY }}
          path: _src
          sparse-checkout: |
            app
            tools
      - name: Код робота на место
        run: rm -rf app tools && cp -R _src/app _src/tools . && rm -rf _src

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.2'

      - name: Архив площадок
        shell: bash
        run: |
          mkdir -p tmp data
          ruby app/backfill.rb 2>&1 | tee tmp/backfill.log
          exit ${PIPESTATUS[0]}

      - name: Сохранить память
        if: always()
        run: |
          git config user.name "monitorg-kz-bot"
          git config user.email "monitorg-kz-bot@users.noreply.github.com"
          git add -A data
          git commit -q -m "архив: $(date '+%d.%m.%Y %H:%M')" || echo "без изменений"
          git push || (git pull --rebase --autostash -q && git push)

      - name: Сборка сайта
        run: ruby app/build.rb

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Сигнал о сбое — в Telegram
        if: failure()
        continue-on-error: true
        run: ruby app/alert.rb --event "ночной архив площадок упал"
